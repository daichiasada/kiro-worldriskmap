<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1a2029">World Geopolitical Risk Map — Architecture</text>

  <!-- Client -->
  <rect x="60" y="90" width="180" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="150" y="123" font-size="14" font-weight="600" fill="#1a2029" text-anchor="middle">User (Web Browser)</text>
  <text x="150" y="145" font-size="12" fill="#334" text-anchor="middle">EN / JA</text>

  <!-- AWS boundary -->
  <rect x="320" y="78" width="450" height="234" rx="10" fill="none" stroke="#d79b00" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="334" y="100" font-size="13" font-weight="700" fill="#d79b00">AWS Account (us-east-1)</text>

  <rect x="350" y="128" width="185" height="92" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="442" y="156" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">Amazon CloudFront</text>
  <text x="442" y="176" font-size="11" fill="#334" text-anchor="middle">HTTPS redirect · OAC</text>
  <text x="442" y="193" font-size="11" fill="#334" text-anchor="middle">SPA 403/404 -&gt; index.html</text>

  <rect x="565" y="128" width="180" height="92" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="655" y="156" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">Amazon S3 (private)</text>
  <text x="655" y="176" font-size="11" fill="#334" text-anchor="middle">static site assets</text>
  <text x="655" y="193" font-size="11" fill="#334" text-anchor="middle">Block Public Access</text>

  <text x="350" y="248" font-size="11" font-style="italic" fill="#555">CloudFormation stack: WorldRiskMapStack</text>

  <!-- Frontend -->
  <rect x="60" y="360" width="700" height="205" rx="10" fill="none" stroke="#9673a6" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="74" y="382" font-size="13" font-weight="700" fill="#9673a6">Frontend SPA — React 18 + TypeScript (Vite build)</text>

  <rect x="80" y="400" width="200" height="95" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="180" y="426" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">Views</text>
  <text x="180" y="446" font-size="10.5" fill="#334" text-anchor="middle">Map · Ranking · Relations</text>
  <text x="180" y="462" font-size="10.5" fill="#334" text-anchor="middle">(G7+) · Country Detail</text>
  <text x="180" y="478" font-size="10.5" fill="#334" text-anchor="middle">Compare · Sources</text>

  <rect x="300" y="400" width="220" height="95" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="410" y="426" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">Domain layer (pure)</text>
  <text x="410" y="446" font-size="10.5" fill="#334" text-anchor="middle">risk.ts · relations.ts</text>
  <text x="410" y="462" font-size="10.5" fill="#334" text-anchor="middle">composite score · bands</text>
  <text x="410" y="478" font-size="10.5" fill="#334" text-anchor="middle">bilateral (symmetric)</text>

  <rect x="540" y="400" width="200" height="95" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="640" y="426" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">Data + i18n</text>
  <text x="640" y="446" font-size="10.5" fill="#334" text-anchor="middle">countries · relations</text>
  <text x="640" y="462" font-size="10.5" fill="#334" text-anchor="middle">isoNumeric</text>
  <text x="640" y="478" font-size="10.5" fill="#334" text-anchor="middle">en/ja messages</text>

  <text x="80" y="528" font-size="11" font-style="italic" fill="#555">Property-Based Tests (fast-check) cover domain invariants · Playwright E2E</text>

  <!-- External CDN -->
  <rect x="820" y="400" width="190" height="75" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="915" y="432" font-size="12.5" font-weight="600" fill="#1a2029" text-anchor="middle">world-atlas TopoJSON</text>
  <text x="915" y="451" font-size="11" fill="#334" text-anchor="middle">(jsDelivr CDN)</text>

  <!-- IaC -->
  <rect x="820" y="120" width="190" height="85" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="915" y="152" font-size="13" font-weight="600" fill="#1a2029" text-anchor="middle">AWS CDK (TypeScript)</text>
  <text x="915" y="172" font-size="11" fill="#334" text-anchor="middle">infra/</text>
  <text x="915" y="189" font-size="11" fill="#334" text-anchor="middle">one-command deploy</text>

  <!-- Kiro artifacts -->
  <rect x="60" y="620" width="950" height="64" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="80" y="648" font-size="13" font-weight="700" fill="#1a2029">Kiro (.kiro/)</text>
  <text x="80" y="669" font-size="12" fill="#334">Spec · Steering · Hooks (command + agent) · Property-Based Testing · MCP · Power (packaged) · Custom Agents</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Client -> CloudFront (HTTPS) -->
  <line x1="240" y1="130" x2="348" y2="150" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="258" y="124" font-size="10" fill="#444">HTTPS</text>

  <!-- CloudFront -> S3 (OAC) -->
  <line x1="535" y1="174" x2="563" y2="174" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="505" y="118" font-size="10" fill="#444">OAC (SigV4)</text>

  <!-- CDK -> AWS (deploys) -->
  <line x1="865" y1="120" x2="770" y2="110" stroke="#444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="772" y="96" font-size="10" fill="#444">deploys</text>

  <!-- Frontend -> S3 (vite build) -->
  <line x1="655" y1="360" x2="655" y2="222" stroke="#444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="662" y="300" font-size="10" fill="#444">vite build -&gt; assets</text>

  <!-- Client -> CDN (runtime fetch) -->
  <line x1="150" y1="170" x2="150" y2="710" stroke="#444" stroke-width="1.4"/>
  <line x1="150" y1="710" x2="818" y2="462" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="300" y="705" font-size="10" fill="#444">fetch map geometry (runtime)</text>
</svg>
